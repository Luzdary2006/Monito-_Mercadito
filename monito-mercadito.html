<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Monito Mercadito</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3ece0;--fg:#2b1d12;--acc:#e8590c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1610;--fg:#f5e9d6;--acc:#ff8a3d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d1610;--fg:#f5e9d6;--acc:#ff8a3d;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:'Press Start 2P',ui-monospace,monospace;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
#root{min-height:100%;display:flex;align-items:center;justify-content:center}
.app{width:100%;max-width:960px;padding:8px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;align-items:center}
.stage{position:relative;width:100%;aspect-ratio:16/9;border:3px solid var(--fg);background:#000;touch-action:none;overflow:hidden;box-sizing:border-box}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
.hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;padding:6px 8px;font-size:clamp(8px,1.9vw,12px);color:#fff;text-shadow:1px 1px 0 #000;pointer-events:none;gap:6px}
.grp{display:flex;align-items:center;gap:clamp(4px,1.4vw,10px)}
.ib{background:rgba(0,0,0,.5);border:2px solid #fff;color:#fff;width:clamp(26px,5vw,36px);height:clamp(26px,5vw,36px);display:grid;place-items:center;cursor:pointer;padding:0;pointer-events:auto}
.ov{position:absolute;inset:0;background:rgba(20,12,6,.8);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(6px,1.6vw,14px);text-align:center;padding:10px;font-size:clamp(8px,1.7vw,11px);line-height:1.6;overflow:auto}
.ov h1{font-size:clamp(12px,3.6vw,26px);margin:0;color:#ffd43b;text-shadow:2px 2px 0 #7a3b00;line-height:1.3}
.btn{font-family:inherit;font-size:clamp(9px,2vw,13px);background:var(--acc);color:#fff;border:3px solid #fff;padding:10px 14px;display:inline-flex;gap:8px;align-items:center;justify-content:center;cursor:pointer;box-shadow:3px 3px 0 #000}
.btn.sec{background:#4a4a4a}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.rules{display:grid;gap:6px;text-align:left;max-width:540px}
.rules div{display:flex;gap:8px;align-items:flex-start}
.ctrl{display:flex;gap:12px;width:min(100%,520px)}.jump{flex:1;height:76px;font-size:13px;touch-action:none;box-shadow:4px 4px 0 var(--fg);border-color:var(--fg)}.duck{background:#1971c2}
.keys{font-size:8px;line-height:1.8;margin:0;text-align:center;opacity:.75}
.heart.hit{animation:shk .3s 2}@keyframes shk{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.fly{position:absolute;left:8px;top:42px;display:flex;gap:6px;align-items:center;pointer-events:none}.flybg{width:92px;height:9px;border:2px solid #fff;background:rgba(0,0,0,.5)}.flybg div{height:100%;background:#4dabf7}
.banner{position:absolute;top:30%;left:0;right:0;text-align:center;color:#ffd43b;text-shadow:2px 2px 0 #000;font-size:clamp(9px,2.6vw,18px);pointer-events:none}
@media (orientation:landscape) and (max-height:520px){
 .app{max-width:none;padding:0;width:min(100vw,calc(100dvh*16/9))}
 .stage{border-width:0}
 .ctrl{display:contents}.jump{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:84px;height:84px;border-radius:50%;opacity:.85;z-index:5;flex:none}.jump:not(.duck){right:calc(14px + env(safe-area-inset-right,0px))}.duck{left:calc(14px + env(safe-area-inset-left,0px))}
 .jump span,.keys{display:none}
}

const {useState,useEffect,useRef}=React,L=window.LucideReact||{},h=React.createElement;
const Ic=(n,p)=>L[n]?h(L[n],p):null;

const loadSprites=()=>Promise.all(Object.entries(SP_SRC).map(([k,s])=>new Promise(r=>{const i=new Image();i.onload=()=>r([k,i]);i.src=s}))).then(a=>Object.fromEntries(a));

function Engine(cv,cb){
const c=cv.getContext('2d');c.imageSmoothingEnabled=false;
const W=320,H=180,GY=140,PX=56;
let SP=null,st='idle',paused=false,t,v=70,P,E,G,PT,sc,hp,bills,inv,shake,hold=false,duck=false,flyT=0,lastRB=0,mute=false,phase,off=0,last=0,raf=0,spawnX,jb=0,ac=null,key='',alive=true;
loadSprites().then(s=>SP=s);
const rnd=(a,b)=>a+Math.random()*(b-a);
const spd=()=>100+150*Math.pow(Math.min(t/120,1),1.1);
function reset(){t=0;flyT=0;lastRB=0;sc=0;hp=6;bills=0;inv=0;shake=0;E=[];G=[];PT=[];phase=0;spawnX=W+70;P={y:GY,vy:0,slip:0,coy:0,rot:0,fall:false}}
reset();
function snd(f,d,ty,sl){if(mute)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const n=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type=ty||'square';o.frequency.setValueAtTime(f,n);if(sl)o.frequency.exponentialRampToValueAtTime(sl,n+d);g.gain.setValueAtTime(.06,n);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(n+d)}catch(e){}}
const emit=(x,y,col,n)=>{for(let i=0;i<n;i++)PT.push({x,y,vx:rnd(-50,50),vy:rnd(-90,-10),l:.5,c:col})};
function pick(w){let s=w.reduce((a,b)=>a+b[1],0),r=Math.random()*s;for(const[k,x]of w){if((r-=x)<0)return k}return w[0][0]}
const bill=(x,y)=>E.push({k:'bill',x,y,w:18,h:10}),crate=(x,hh,ww)=>E.push({k:'crate',x,y:GY-hh,w:ww||16,h:hh}),peel=x=>E.push({k:'peel',x,y:GY-8,w:18,h:8}),bird=x=>E.push({k:'bird',x,y:GY-30,w:18,h:14});
function spawn(){
 const d=Math.min(t/120,1),x=spawnX,vv=spd(),gw=Math.round(26+30*d+rnd(0,8));let wd=20;
 const w=[['bills',Math.round(30-18*d)],['peel',Math.round(24+10*d)],['crate',Math.round(20+14*d)],['high',Math.round(14-6*d)],['banana',hp<6?16:3]];
 if(d>.12)w.push(['gap',18]);if(d>.35)w.push(['peelgap',14]);if(d>.5)w.push(['crategap',14],['wide',10]);if(d>.4)w.push(['seq',10+Math.round(14*d)]);if(t>10&&t-lastRB>28&&flyT<=0)w.push(['rb',16]);if(d>.15)w.push(['bird',10+Math.round(16*d)]);if(d>.4)w.push(['mix',8+Math.round(10*d)]);if(d>.55)w.push(['duck2',8]);
 const k=pick(w);
 if(k==='bills'){{const up=flyT>0?-30:0;for(let i=0;i<5;i++)bill(x+i*18,GY-18+up-Math.sin(i/4*Math.PI)*22)}wd=90}
 else if(k==='peel'){peel(x);wd=18}
 else if(k==='crate'){crate(x,d>.45&&Math.random()<.4?32:16);wd=16}
 else if(k==='wide'){crate(x,16,32);wd=32}
 else if(k==='high'){for(let i=0;i<3;i++)bill(x+i*18,GY-52);wd=54}
 else if(k==='banana'){E.push({k:'banana',x,y:GY-64,w:14,h:32});wd=14}
 else if(k==='gap'){G.push({x,w:gw});for(let i=0;i<3;i++)bill(x+gw/2-27+i*18,GY-32-Math.sin(i/2*Math.PI)*14);wd=gw}
 else if(k==='rb'){E.push({k:'redbull',x,y:GY-44,w:10,h:16});lastRB=t;wd=14}
 else if(k==='bird'){bird(x);wd=18}
 else if(k==='duck2'){const sp=18+vv*.45;bird(x);bird(x+sp);wd=sp+18}
 else if(k==='mix'){const sp=16+vv*.55;crate(x,16);bird(x+sp);wd=sp+18}
 else if(k==='seq'){const n=d>.75&&Math.random()<.5?3:2,sp=16+vv*.52;for(let i=0;i<n;i++){Math.random()<.5?peel(x+i*sp):crate(x+i*sp,16)}wd=n*sp}
 else{const sep=(k==='peelgap'?18:16)+vv*.5;k==='peelgap'?peel(x):crate(x,16);G.push({x:x+sep,w:gw});wd=sep+gw}
 spawnX=x+wd+vv*(.8-.4*d)+20+rnd(0,18);
}
